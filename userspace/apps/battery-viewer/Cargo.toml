[package]
name = "battery-viewer"
version = "0.1.3"
edition = "2021"
description = "GTK viewer for local battery diagnostic logs"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7" }
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
cairo-rs = { version = "0.20", features = ["png"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

{{- $architecture := or .architecture "arm64" -}}
{{- $ssh := or .ssh "" -}}

architecture: {{ $architecture }}

actions:
  - action: apt
    recommends: true
    description: Install base packages
    packages:
      - mobian-base
{{ if $ssh }}
      - openssh-server
{{ end }}
      # systemd-repart is deliberately absent. This image is installed into an
      # existing fixed-size partition; an image able to repartition itself
      # could destroy the Android userdata partition.
      # Reason for this: it's @a-wai's preferred editor
      - vim

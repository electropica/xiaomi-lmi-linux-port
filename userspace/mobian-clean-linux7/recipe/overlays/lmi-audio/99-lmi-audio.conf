# 2026-10-31 : carte lmi (AFE 7.2.12).
# L'enumeration automatique de spa echoue : l'adaptateur ALSA demande S32_LE
# par defaut alors que l'AFE n'expose que S16_LE/S24_LE -> aucun noeud sink.
# On cree donc explicitement le sink avec le format S16 (48 kHz, stereo).
context.objects = [
    { factory = adapter
      args = {
          factory.name           = api.alsa.pcm.sink
          node.name              = "alsa-sink-lmi-speaker"
          node.description       = "Haut-parleur lmi (S16)"
          media.class            = "Audio/Sink"
          api.alsa.path          = "lmi_speaker"
          api.alsa.period-size   = 1024
          api.alsa.headroom      = 0
          api.alsa.disable-mmap  = false
          api.alsa.disable-batch = false
          audio.format           = "S16"
          audio.rate             = 48000
          audio.channels         = 2
          audio.position         = "FL,FR"
      }
      flags = [ nofail ]
    }
]

context.objects = [
    { factory = adapter
      # A missing diagnostic ALSA card must not stop the entire audio server.
      flags = [ nofail ]
      args = {
        factory.name = api.alsa.pcm.sink
        node.name = lmi-speaker
        node.description = "Haut-parleur lmi"
        media.class = Audio/Sink
        api.alsa.path = lmi_speaker
        api.alsa.disable-mmap = true
        audio.format = S32LE
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        session.suspend-timeout-seconds = 5
      }
    }
]

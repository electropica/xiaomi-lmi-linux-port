# Added by the Linux 7 next-action work (2026-10-27).
# The graphical session needs a valid VT number: since Linux 7.2.12 the
# kernel provides /sys/class/tty/tty0/active, so logind's seat0 owns VTs and
# rejects CreateSession(seat0, vtnr=0) with 'VT number out of range'.
# VT 1 is already the active VT (/sys/class/tty/tty0/active == tty1), so
# claiming it does not switch the console.
# Remove this file and restart phosh-m0.service to revert.
[Service]
Environment=XDG_VTNR=1

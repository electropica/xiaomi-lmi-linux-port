# Added by the Linux 7 next-action work (2026-10-27).
# phosh-m0.service can exit with status 0 when a restart overlaps a previous
# gnome-session-manager shutdown (GDBus TransactionIsDestructive on
# gnome-session-wayland@phosh.target), and Restart=on-failure does not fire.
# Restart=always + RestartSec=5 makes systemd retry once the conflicting job
# has drained.  An explicit `systemctl stop` is still honoured.
# Remove this file and restart phosh-m0.service to revert.
[Service]
Restart=always
RestartSec=5
